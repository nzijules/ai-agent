<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logo animé NOVA</title><link rel="stylesheet" href="_base.css">
<style>
body{background:#0b0910}
.logo{position:relative;display:flex;flex-direction:column;align-items:center}
.mask{overflow:hidden;position:relative;padding:0 6px}
.word{font-size:clamp(56px,15vw,128px);font-weight:800;letter-spacing:.06em;display:flex}
.word span{display:inline-block;animation:rise .7s cubic-bezier(.34,1.4,.64,1) both;animation-delay:calc(450ms + var(--i)*80ms)}
@keyframes rise{from{transform:translateY(110%)}to{transform:none}}
.line{width:100%;height:3px;background:linear-gradient(90deg,#ff5b2e,#7c4dff);transform-origin:left;animation:draw .45s cubic-bezier(.22,1,.36,1) both}
@keyframes draw{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.shine{position:absolute;inset:0;background:linear-gradient(100deg,transparent 35%,#ffffffcc 50%,transparent 65%);mix-blend-mode:overlay;transform:translateX(-120%);animation:shine 1s ease-in-out 1.15s both}
@keyframes shine{to{transform:translateX(120%)}}
.tag{margin-top:18px;font-size:clamp(14px,3vw,20px);letter-spacing:.3em;text-transform:uppercase;color:#ffffffb0;animation:fade .6s ease-out 1.6s both}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style></head><body>
<a class="back" href="../index.html">← Ebook</a>
<div class="logo">
  <div class="mask"><div class="word" aria-label="NOVA"><span style="--i:0">N</span><span style="--i:1">O</span><span style="--i:2">V</span><span style="--i:3">A</span></div><div class="shine"></div></div>
  <div class="line"></div>
  <div class="tag">Build the future</div>
</div>
<button class="replay">↻ Rejouer</button><script src="_replay.js"></script></body></html>
